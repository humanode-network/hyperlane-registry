name: NPM Release

# Publishes `@humanode-hyperlane/registry` on a manually pushed
# `npm-v<package version>` tag, through npm's trusted publishing: npm checks
# this workflow's OIDC identity, so no npm token is stored, and the package gets
# a provenance statement. Upstream's `release.yml` published `@hyperlane-xyz`
# through changesets release PRs and a GitHub App; our versions follow upstream's
# releases, so that workflow is gone from this fork.

on:
  push:
    tags:
      - 'npm-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # `npm publish` runs the `prepare` script, which would install Git hooks.
  HUSKY: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Identifies this workflow to npm for trusted publishing and provenance.
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@11.19.1

      - name: Check the tag against the package version
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "npm-v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $VERSION"
            exit 1
          fi

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: npm publish --access public
