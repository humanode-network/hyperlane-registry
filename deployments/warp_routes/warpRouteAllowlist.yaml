# Warp route config IDs to include as bridge-only routes in the universal router engine
# Warp Route IDs use format `SYMBOL/{label}`; labels are registry-defined and must not be reordered
# `warpRouteIds` must be an array; `null` is invalid
# An empty array adds no bridge-only routes; statically configured swap routes remain included
# Load failures use the last-known-good allowlist or the engine's built-in fallback
# Entries with notices use { id, notices }; blocksTransfer controls behavior, severity controls styling.
warpRouteIds: []
