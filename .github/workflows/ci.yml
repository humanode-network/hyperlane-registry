name: ci

on:
  # Triggers the workflow on push or pull request events
  push:
    branches: [main]
  pull_request:
  # For queues into main
  merge_group:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    # test:unit runs the same build before the unit tests.
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm build passed in the test job
        run: echo 'pnpm run test:unit completed its build step'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: pnpm-cache
        uses: ./.github/actions/pnpm-cache
      - name: lint
        run: pnpm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: pnpm-cache
        uses: ./.github/actions/pnpm-cache
      - name: format
        run: |
          pnpm run format
          CHANGES=$(git status -s)
          if [[ ! -z $CHANGES ]]; then
            echo "Changes found: $CHANGES"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: pnpm-cache
        uses: ./.github/actions/pnpm-cache
      - name: test
        run: pnpm run test:unit

      - name: validate-file-path
        run: |
          node ./scripts/validate-file-path.js

      - name: validate-svg
        run: |
          node ./scripts/validate-svg.js

      - name: validate-file-data
        run: |
          node ./scripts/validate-file-data.js

  # The combined chain metadata and addresses, the warp route configs and the
  # optimized SVGs are generated files committed with the change that affects
  # them. Upstream regenerated and committed them from a workflow on main
  # through its GitHub App.
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: pnpm-cache
        uses: ./.github/actions/pnpm-cache
      - name: regenerate
        run: |
          pnpm run build
          node ./scripts/optimize-svg.js
      - name: check-for-changes
        run: |
          CHANGES=$(git status -s)
          if [[ ! -z $CHANGES ]]; then
            echo "Generated files are out of date; run 'pnpm run build' and 'node ./scripts/optimize-svg.js' and commit the result:"
            echo "$CHANGES"
            exit 1
          fi
